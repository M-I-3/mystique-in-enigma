<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="3; url=https://m-i-e.pages.dev" />
    <meta name="description" content="MIE (Mystique In Enigma) のポートフォリオサイトは新しいアドレスへ移転しました。" />
    <title>Site Moved | MIE - Mystique In Enigma</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23040405'/%3E%3Crect x='2' y='2' width='96' height='96' fill='none' stroke='rgba(255,255,255,0.14)' stroke-width='2'/%3E%3Ctext x='50' y='53' font-family='Georgia, serif' font-size='64' font-weight='bold' fill='%23f0ece6' text-anchor='middle' dominant-baseline='central'%3EM%3C/text%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #040405;
        --panel: rgba(10, 10, 13, 0.92);
        --text: #f0ece6;
        --muted: #9d9794;
        --line: rgba(255, 255, 255, 0.08);
        --glow: rgba(209, 182, 255, 0.14);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.03), transparent 30%),
          #000000;
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        position: relative;
        overflow: hidden;
      }
      .noise {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
        background-size: 100% 3px, 4px 100%;
        opacity: 0.3;
      }
      .panel {
        position: relative;
        z-index: 1;
        width: min(580px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 44px 36px 40px;
        text-align: center;
        clip-path: polygon(0 3%, 98% 0, 100% 97%, 2% 100%);
      }
      .brand-mark {
        font-size: 1.15rem;
        letter-spacing: 0.45em;
        text-transform: uppercase;
        color: var(--text);
        margin-bottom: 6px;
      }
      .brand-sub {
        font-size: 0.85rem;
        letter-spacing: 0.18em;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 28px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 18px;
      }
      h1 {
        font-size: clamp(1.4rem, 4vw, 1.85rem);
        font-weight: 400;
        letter-spacing: 0.04em;
        margin: 0 0 16px;
        line-height: 1.4;
      }
      p {
        margin: 0 0 14px;
        line-height: 1.8;
        color: #d2cdc8;
        font-size: 0.96rem;
      }
      .notice-en {
        color: var(--muted);
        font-size: 0.88rem;
        margin-bottom: 24px;
      }
      .countdown-bar {
        height: 2px;
        width: 100%;
        background: rgba(255, 255, 255, 0.08);
        position: relative;
        margin: 24px 0 28px;
        overflow: hidden;
      }
      .countdown-progress {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 100%;
        background: linear-gradient(90deg, rgba(209, 182, 255, 0.3), #d1b6ff);
        animation: progress 3s linear forwards;
        transform-origin: left;
      }
      @keyframes progress {
        0% { transform: scaleX(0); }
        100% { transform: scaleX(1); }
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 28px;
        border: 1px solid var(--line);
        color: var(--text);
        text-decoration: none;
        background: linear-gradient(135deg, rgba(209,182,255,0.18), rgba(127,212,255,0.10));
        box-shadow: 0 0 0 1px rgba(255,255,255,0.05) inset, 0 0 24px var(--glow);
        font-family: inherit;
        font-size: 0.98rem;
        letter-spacing: 0.08em;
        transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
      }
      .button:hover {
        transform: translateY(-2px);
        border-color: rgba(255,255,255,0.35);
        box-shadow: 0 0 32px rgba(209, 182, 255, 0.28);
      }
      .url-link {
        display: block;
        margin-top: 22px;
        font-size: 0.85rem;
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: 3px;
        word-break: break-all;
      }
      .url-link:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <main class="panel" role="region" aria-label="サイト移転のご案内">
      <div class="brand-mark">MΦE</div>
      <div class="brand-sub">Mystique In Enigma</div>

      <h1>サイト移転のお知らせ</h1>
      <p>当ポートフォリオサイトは、新しいアドレス（URL）へ移転いたしました。<br />まもなく新しいサイトへ自動的に移動します。</p>
      <p class="notice-en">The portfolio site has moved to a new address.<br />Redirecting to the new site in a few seconds...</p>

      <div class="countdown-bar">
        <div class="countdown-progress"></div>
      </div>

      <a class="button" href="https://m-i-e.pages.dev" id="redirect-link">新しいサイトへ移動する ↗</a>
      <a class="url-link" href="https://m-i-e.pages.dev">https://m-i-e.pages.dev</a>
    </main>

    <script>
      const TARGET_URL = 'https://m-i-e.pages.dev';
      setTimeout(() => {
        window.location.replace(TARGET_URL);
      }, 3000);
    </script>
  </body>
</html>
